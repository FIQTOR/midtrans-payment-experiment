    <rect x="836" y="260" width="16" height="16"/><rect x="860" y="284" width="16" height="16"/><rect x="884" y="260" width="16" height="16"/>
    <rect x="836" y="308" width="16" height="16"/><rect x="860" y="308" width="16" height="16"/>
