    <circle cx="768" cy="484" r="4" fill="#59b3ff"/><text x="784" y="488" fill="#c7d7f0">webhook: settlement</text><text x="940" y="488" fill="#7f9ac4" text-anchor="end">09.38.02</text>
    <circle cx="768" cy="516" r="4" fill="#34d399"/><text x="784" y="520" fill="#c7d7f0">refund requested</text><text x="940" y="520" fill="#7f9ac4" text-anchor="end">09.40.11</text>
