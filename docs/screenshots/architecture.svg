<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2340"/><stop offset="1" stop-color="#070d19"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" fill="url(#bg)"/>

  <text x="550" y="52" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Architecture</text>
  <text x="550" y="76" font-family="Inter, sans-serif" font-size="13" fill="#7f9ac4" text-anchor="middle">Express backend orchestrates all Midtrans calls; the browser only ever sees the client key.</text>

  <!-- Browser -->
  <rect x="60" y="140" width="240" height="240" rx="16" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="180" y="176" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Browser</text>
  <text x="180" y="200" font-family="Inter, sans-serif" font-size="12" fill="#7f9ac4" text-anchor="middle">React 19 · Vite · Tailwind</text>
  <g font-family="Inter, sans-serif" font-size="12" fill="#c7d7f0">
    <text x="88" y="240">• Dashboard + SSE stream</text>
    <text x="88" y="266">• Create payment form</text>
    <text x="88" y="292">• Snap.js (client key)</text>
    <text x="88" y="318">• Webhook tester</text>
  </g>

  <!-- Backend -->
  <rect x="400" y="140" width="300" height="240" rx="16" fill="#1f66c4" opacity="0.22" stroke="#59b3ff" stroke-opacity="0.4"/>
  <text x="550" y="176" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Express backend :4011</text>
  <text x="550" y="200" font-family="Inter, sans-serif" font-size="12" fill="#c7d7f0" text-anchor="middle">Server Key (secret) · Basic Auth</text>
  <g font-family="Inter, sans-serif" font-size="12" fill="#eaf2ff">
    <text x="428" y="240">• /api/payments (create/list/stats)</text>
    <text x="428" y="266">• status / cancel / expire / refund</text>
    <text x="428" y="292">• /api/webhooks (sha512 verify)</text>
    <text x="428" y="318">• store + SSE · Sequelize (opt.)</text>
  </g>

  <!-- Midtrans -->
  <rect x="800" y="140" width="240" height="240" rx="16" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="920" y="176" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Midtrans</text>
  <text x="920" y="200" font-family="Inter, sans-serif" font-size="12" fill="#7f9ac4" text-anchor="middle">Sandbox / Production</text>
  <g font-family="Inter, sans-serif" font-size="12" fill="#c7d7f0">
    <text x="828" y="240">• Snap /transactions</text>
    <text x="828" y="266">• Core /v2/charge</text>
    <text x="828" y="292">• /v2/status · refund</text>
    <text x="828" y="318">• Notifications (POST)</text>
  </g>

  <!-- arrows -->
  <g stroke="#59b3ff" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="300" y1="240" x2="396" y2="240"/>
  </g>
  <g stroke="#59b3ff" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="700" y1="240" x2="796" y2="240"/>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#59b3ff"/>
    </marker>
  </defs>
  <text x="348" y="228" font-family="Inter, sans-serif" font-size="11" fill="#7f9ac4" text-anchor="middle">REST / SSE</text>
  <text x="748" y="228" font-family="Inter, sans-serif" font-size="11" fill="#7f9ac4" text-anchor="middle">HTTPS API</text>

  <!-- webhook return path -->
  <path d="M920 380 C920 450 550 450 550 384" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#b)"/>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399"/>
    </marker>
  </defs>
  <text x="735" y="452" font-family="Inter, sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">webhook notification (sha512)</text>
</svg>
