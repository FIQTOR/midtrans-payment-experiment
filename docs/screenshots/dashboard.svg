    <rect x="800" y="506" width="56" height="22" rx="11" fill="#34d399" opacity="0.18"/><text x="828" y="521" fill="#6ee7b7" text-anchor="middle">PAID</text>

    <text x="296" y="564" fill="#c7d7f0">ORDER-BDIXKON-PJ</text><text x="560" y="564" fill="#c7d7f0">gopay</text><text x="680" y="564" fill="#ffffff">Rp 250.000</text>
    <rect x="800" y="550" width="72" height="22" rx="11" fill="#fbbf24" opacity="0.18"/><text x="836" y="565" fill="#fcd34d" text-anchor="middle">PENDING</text>

