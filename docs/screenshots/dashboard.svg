    <rect x="800" y="594" width="60" height="22" rx="11" fill="#fb7185" opacity="0.18"/><text x="830" y="609" fill="#fda4af" text-anchor="middle">FAILED</text>

    <text x="296" y="652" fill="#c7d7f0">ORDER-NJWJIST7JQ</text><text x="560" y="652" fill="#c7d7f0">bank_transfer</text><text x="680" y="652" fill="#ffffff">Rp 75.000</text>
    <rect x="800" y="638" width="72" height="22" rx="11" fill="#fbbf24" opacity="0.18"/><text x="836" y="653" fill="#fcd34d" text-anchor="middle">PENDING</text>
