    <rect x="1124" y="586" width="98" height="28" rx="7" fill="#0d1f38"/><text x="1173" y="604" text-anchor="middle">BCA VA</text>
    <rect x="1016" y="620" width="98" height="28" rx="7" fill="#0d1f38"/><text x="1065" y="638" text-anchor="middle">GoPay</text>
    <rect x="1124" y="620" width="98" height="28" rx="7" fill="#0d1f38"/><text x="1173" y="638" text-anchor="middle">Card</text>
