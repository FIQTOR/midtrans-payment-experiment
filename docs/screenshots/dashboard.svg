      <stop offset="0" stop-color="#0d2340"/>
      <stop offset="1" stop-color="#070d19"/>
    </linearGradient>
    <linearGradient id="pay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f66c4"/>
      <stop offset="1" stop-color="#0f2f6b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect width="1280" height="48" fill="#0a1730"/>
  <circle cx="20" cy="24" r="6" fill="#ff5f57"/><circle cx="40" cy="24" r="6" fill="#febc2e"/><circle cx="60" cy="24" r="6" fill="#28c840"/>
  <rect x="90" y="12" width="420" height="24" rx="12" fill="#132a4d"/>
  <text x="110" y="29" font-family="Inter, sans-serif" font-size="12" fill="#7f9ac4">localhost:5175</text>

  <!-- sidebar -->
