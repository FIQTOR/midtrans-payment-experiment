<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Midtrans Pay webhook tester">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2340"/><stop offset="1" stop-color="#070d19"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect width="1280" height="48" fill="#0a1730"/>
  <circle cx="20" cy="24" r="6" fill="#ff5f57"/><circle cx="40" cy="24" r="6" fill="#febc2e"/><circle cx="60" cy="24" r="6" fill="#28c840"/>

  <rect x="0" y="48" width="240" height="712" fill="#0b1a30"/>
  <rect x="16" y="278" width="208" height="40" rx="10" fill="#2f7fe0" opacity="0.25"/>
  <text x="44" y="303" font-family="Inter, sans-serif" font-size="14" fill="#ffffff">Webhook Tester</text>

  <text x="272" y="100" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Webhook tester</text>

  <rect x="272" y="130" width="760" height="580" rx="16" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="304" y="172" font-family="Inter, sans-serif" font-size="11" fill="#7f9ac4">NOTIFICATION ENDPOINT</text>
  <rect x="304" y="182" width="600" height="40" rx="9" fill="#0b1a30" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="320" y="207" font-family="monospace" font-size="13" fill="#c7d7f0">http://localhost:4011/api/webhooks/midtrans</text>
  <rect x="916" y="182" width="84" height="40" rx="9" fill="#ffffff" opacity="0.06"/>
  <text x="958" y="207" font-family="Inter, sans-serif" font-size="12" fill="#c7d7f0" text-anchor="middle">Copy</text>

  <text x="304" y="258" font-family="Inter, sans-serif" font-size="11" fill="#7f9ac4">PAYLOAD (JSON)</text>
  <rect x="304" y="268" width="696" height="340" rx="9" fill="#070f1d" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="monospace" font-size="13">
    <text x="322" y="296" fill="#7f9ac4">{</text>
    <text x="322" y="322" fill="#7dd3fc">"order_id"</text><text x="440" y="322" fill="#c7d7f0">: </text><text x="454" y="322" fill="#a5f3c9">"ORDER-DEMO-1"</text><text x="600" y="322" fill="#7f9ac4">,</text>
    <text x="322" y="348" fill="#7dd3fc">"transaction_id"</text><text x="478" y="348" fill="#c7d7f0">: </text><text x="492" y="348" fill="#a5f3c9">"tx-demo-1"</text><text x="600" y="348" fill="#7f9ac4">,</text>
    <text x="322" y="374" fill="#7dd3fc">"transaction_status"</text><text x="520" y="374" fill="#c7d7f0">: </text><text x="534" y="374" fill="#a5f3c9">"settlement"</text><text x="640" y="374" fill="#7f9ac4">,</text>
    <text x="322" y="400" fill="#7dd3fc">"status_code"</text><text x="452" y="400" fill="#c7d7f0">: </text><text x="466" y="400" fill="#a5f3c9">"200"</text><text x="520" y="400" fill="#7f9ac4">,</text>
    <text x="322" y="426" fill="#7dd3fc">"gross_amount"</text><text x="466" y="426" fill="#c7d7f0">: </text><text x="480" y="426" fill="#a5f3c9">"49000.00"</text><text x="580" y="426" fill="#7f9ac4">,</text>
    <text x="322" y="452" fill="#7dd3fc">"payment_type"</text><text x="466" y="452" fill="#c7d7f0">: </text><text x="480" y="452" fill="#a5f3c9">"qris"</text><text x="540" y="452" fill="#7f9ac4">,</text>
    <text x="322" y="478" fill="#7dd3fc">"fraud_status"</text><text x="466" y="478" fill="#c7d7f0">: </text><text x="480" y="478" fill="#a5f3c9">"accept"</text><text x="560" y="478" fill="#7f9ac4">,</text>
    <text x="322" y="504" fill="#7dd3fc">"signature_key"</text><text x="480" y="504" fill="#c7d7f0">: </text><text x="494" y="504" fill="#a5f3c9">"(set when not in mock mode)"</text>
    <text x="322" y="530" fill="#7f9ac4">}</text>
  </g>

  <rect x="304" y="632" width="166" height="42" rx="10" fill="#1f66c4"/>
  <text x="387" y="658" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Fire notification</text>
  <text x="304" y="694" font-family="Inter, sans-serif" font-size="12" fill="#7f9ac4">signature_key = sha512(order_id + status_code + gross_amount + server_key)</text>

  <!-- toast -->
  <rect x="880" y="640" width="300" height="52" rx="12" fill="#34d399" opacity="0.16" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="904" y="671" font-family="Inter, sans-serif" font-size="13" fill="#a7f3d0">Webhook accepted → PAID</text>
</svg>
